<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata · CF Detailing</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @font-face { font-family: "Bebas Neue"; src: url("/fonts/BebasNeue-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  :root {
    --bg: #000000; --ink: #f5f5f3; --ink-muted: #a6a9b0; --line: #2a2d33; --border-strong: #6b7079;
    --accent: #5cb8f2; --on-accent: #000000;
    --font-display: "Bebas Neue", "Oswald", Impact, sans-serif;
    --font-sans: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--font-sans); }
  header { padding: 16px clamp(20px, 5vw, 48px); border-bottom: 1px solid var(--line); }
  header img { display: block; height: 48px; width: auto; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; max-width: 1200px; width: 100%; margin: 0 auto; padding: 64px clamp(20px, 5vw, 48px); }
  .eyebrow { margin: 0; font: 600 13px/16px var(--font-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font: 400 clamp(56px, 10vw, 112px)/.92 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 0; max-width: 560px; color: var(--ink-muted); }
  .azioni { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 24px; font: 600 13px/16px var(--font-sans); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border-radius: 2px; }
  .btn-primario { background: var(--accent); color: var(--on-accent); }
  .btn-secondario { border: 1px solid var(--border-strong); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<header><a href="/" aria-label="CF Detailing, torna alla home"><img src="/img/logo-cf-detailing-bianco.svg" alt="CF Detailing"></a></header>
<main>
  <p class="eyebrow">Errore 404</p>
  <h1>Pagina non trovata</h1>
  <p>L'indirizzo che hai aperto non esiste o è stato spostato.</p>
  <div class="azioni">
    <a class="btn btn-primario" href="/">Torna alla home</a>
    <a class="btn btn-secondario" href="/#prenota">Prenota un trattamento</a>
  </div>
</main>
</body>
</html>
